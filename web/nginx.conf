server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns every path the filesystem does not, so an unknown
    # path serves the app shell with a 200. Without this, a direct visit or
    # a reload of /sign-in gets nginx's own 404 and the app never boots.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is not fingerprinted. Cached, it would pin browsers to the
    # previous deploy's asset URLs indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
