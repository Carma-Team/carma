name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: ./server

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: carma
          POSTGRES_PASSWORD: carma_test
          POSTGRES_DB: carma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://carma:carma_test@localhost:5432/carma_test
      JWT_SECRET: test_secret_at_least_16_chars
      SMS_PROVIDER: console
      ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy (typecheck)
        run: mypy app

      - name: Apply migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: carma-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
