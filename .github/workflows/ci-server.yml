name: CI · server

# Day 1: only the cheapest job (ruff lint) runs on every PR.
# Heavier jobs (mypy, pytest, smoke) sit behind `workflow_dispatch` and the
# "run-full-ci" label so a flaky pipeline can't block merges before it's
# proven stable. After ~1 green week, flip them to standard `on: pull_request`.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: ./server

jobs:
  # Always-on, fast — should never block a merge.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install ruff==0.6.9
      - name: Ruff (check)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .

  # Heavier jobs — gated. To run on a PR, add the "run-full-ci" label.
  # Manual trigger: Actions tab → "CI · server" → Run workflow.
  typecheck-test:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-full-ci')) || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: carma
          POSTGRES_PASSWORD: carma_test
          POSTGRES_DB: carma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://carma:carma_test@localhost:5432/carma_test
      JWT_SECRET: test_secret_at_least_16_chars
      SMS_PROVIDER: console
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Mypy
        run: mypy app
      - name: Apply DB migrations
        run: alembic upgrade head
      - name: Verify schema is at latest revision
        # Fails loudly if alembic upgrade head silently left the DB behind —
        # e.g., a migration file with a dependency cycle, a broken downgrade step
        # that never ran, or a mis-ordered revision chain.
        run: |
          CURRENT=$(alembic current 2>&1)
          echo "alembic current: $CURRENT"
          if ! echo "$CURRENT" | grep -q "(head)"; then
            echo "::error::DB schema is not at head after alembic upgrade head."
            echo "::error::Check migration chain: alembic history --verbose"
            exit 1
          fi
          echo "Migration sanity check passed — schema is at head."
      - name: Pytest
        run: pytest

  # End-to-end smoke against a live server.
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-full-ci')) }}
    needs: typecheck-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: carma
          POSTGRES_PASSWORD: carma_test
          POSTGRES_DB: carma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://carma:carma_test@localhost:5432/carma_test
      JWT_SECRET: test_secret_at_least_16_chars
      SMS_PROVIDER: console
      ENV: test
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m app.seed
      - name: Start server
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 3000 > /tmp/uvicorn.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://localhost:3000/health/live && break || sleep 1
          done
      - name: Smoke
        working-directory: ${{ github.workspace }}
        run: bash scripts/smoke.sh
      - name: Server logs (on failure)
        if: failure()
        run: cat /tmp/uvicorn.log

  docker-build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: carma-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
