name: CI · server

# Pull requests run the full Postgres-backed suite. That was the plan from day 1
# ("after ~1 green week, flip them to standard `on: pull_request`"), and the week
# passed a long time ago — but the flip never happened, so every server PR was
# green on a run that skipped every test needing a database (CAR-48).
#
# The old escape hatch was a "run-full-ci" label, which never worked for two
# independent reasons: the label did not exist in the repo, and `on: pull_request`
# without `types:` does not fire on `labeled` anyway. It is gone rather than
# fixed — a gate nobody can operate is worse than no gate.
#
# develop guard (issue #25): *pushes* to develop stay cheap — `lint` plus the
# no-database `typecheck-test-nodb`. Postgres, smoke and docker-build do not run
# on a develop push. A PR into develop is a different matter and gets the full
# run; that is the review gate, and develop takes merges without review.

# `pull_request` deliberately carries no `paths:` filter. A workflow skipped by
# a path filter never reports at all, and a required check that never reports
# pins the PR on "Expected - waiting for status to be reported" forever.
# GitHub's own advice is not to require a workflow that can be skipped. Pushes
# keep their filter, because nothing gates a push. The cost is ~2 idle minutes
# on an unrelated PR, and Actions is free on a public repo (CAR-122).
#
# Jobs carry an explicit `name:` because the required-check context is the bare
# job name with no workflow prefix, and `lint` and `test` each existed in two
# of these three workflows (CAR-122).

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# One run per branch/PR. Superseded runs on develop and feature branches are
# cancelled; main is never cancelled so every deployable commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: ./server

jobs:
  # Always-on and fast: nothing here needs a database, so it runs on every push
  # and every pull request. Style, plus the one correctness check that costs
  # nothing to run.
  lint:
    name: server lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install ruff==0.6.9 alembic==1.18.5
      - name: Ruff (check)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: One alembic head
        # Two branches numbering a migration off the same parent is invisible to
        # git (different files, no overlapping lines) and only breaks once both
        # are merged. It belongs here rather than next to `alembic upgrade head`
        # because a push to develop never reaches the Postgres job, and develop is
        # exactly where the two halves meet (CAR-160).
        #
        # `alembic heads` reads the migration files alone: no database, no env.py.
        # That holds only while no migration imports app code at module level.
        # 0011 imports app.services.levels inside downgrade(), which is fine.
        run: |
          HEADS=$(alembic heads)
          COUNT=$(echo "$HEADS" | grep -c '(head)' || true)
          echo "$HEADS"
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::$COUNT alembic heads. Two branches added a migration on the same parent."
            echo "::error::Fix: alembic merge -m \"merge <a> and <b>\" $(echo "$HEADS" | awk '{print $1}' | xargs)"
            exit 1
          fi

  # develop's push-time correctness gate (issue #25). ruff only checks how the
  # code looks — on a develop push this is the only thing that checks whether it
  # works, and develop takes merges without review.
  #
  # #25 filed mypy+pytest under "heavy", but the weight is the Postgres service,
  # not the checks: mypy is ~5s and pytest ~15s. The DB-backed tests skip
  # themselves via conftest when no database is reachable, so this needs no
  # service container and no migrations.
  #
  # It skips a lot, and that number only grows: over 100 of the ~290 tests need
  # Postgres, including every concurrency and migration test. So this is a smoke
  # signal for a develop push, never a substitute for `typecheck-test` — which is
  # why pull requests run that instead of this one.
  typecheck-test-nodb:
    name: server tests (no db)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Nothing listens on 5433 — the DB-backed tests skip rather than fail.
      DATABASE_URL: postgresql+asyncpg://carma:carma_test@localhost:5433/carma_test
      JWT_SECRET: test_secret_at_least_16_chars
      SMS_PROVIDER: console
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Mypy
        run: mypy app
      - name: Pytest (no database)
        run: pytest

  # The real gate: mypy, migrations and the whole suite against a live Postgres.
  # Runs on every pull request — this is the only job that exercises the
  # concurrency, locking and migration tests, and reviewing those on a run that
  # skipped them is reviewing on trust.
  # Also on pushes to main, and on manual dispatch.
  typecheck-test:
    name: server tests
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: carma
          POSTGRES_PASSWORD: carma_test
          POSTGRES_DB: carma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://carma:carma_test@localhost:5432/carma_test
      JWT_SECRET: test_secret_at_least_16_chars
      SMS_PROVIDER: console
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Mypy
        run: mypy app
      - name: Apply DB migrations
        run: alembic upgrade head
      - name: Verify schema is at latest revision
        # Fails loudly if alembic upgrade head silently left the DB behind —
        # e.g., a migration file with a dependency cycle, a broken downgrade step
        # that never ran, or a mis-ordered revision chain.
        run: |
          CURRENT=$(alembic current 2>&1)
          echo "alembic current: $CURRENT"
          if ! echo "$CURRENT" | grep -q "(head)"; then
            echo "::error::DB schema is not at head after alembic upgrade head."
            echo "::error::Check migration chain: alembic history --verbose"
            exit 1
          fi
          echo "Migration sanity check passed — schema is at head."
      - name: Pytest
        run: |
          set -o pipefail
          pytest -rs | tee /tmp/pytest.out
      - name: Assert nothing skipped for want of a database
        # The bug this job exists to prevent was a green tick over tests that
        # never ran. conftest skips rather than fails when Postgres is
        # unreachable, so a service container that quietly failed to start would
        # look exactly like success. Fail loudly instead.
        run: |
          if grep -qi "PostgreSQL not reachable" /tmp/pytest.out; then
            echo "::error::Tests skipped because Postgres was unreachable — this job exists to run them."
            grep -i "PostgreSQL not reachable" /tmp/pytest.out
            exit 1
          fi
          echo "No database-related skips — the DB-backed tests actually ran."

  # End-to-end smoke against a live server: migrations, seed, uvicorn, smoke.sh.
  #
  # Manual dispatch only. The "run-full-ci" label it used to name never worked,
  # so in practice this has always been dispatch-only and nothing changes here.
  # Left as-is deliberately: CAR-48 is about the test suite being skipped, and
  # widening smoke is a separate call — note it also does not run on a push to
  # main today, which is arguably a gap worth its own issue.
  smoke:
    name: server smoke
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: typecheck-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: carma
          POSTGRES_PASSWORD: carma_test
          POSTGRES_DB: carma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://carma:carma_test@localhost:5432/carma_test
      JWT_SECRET: test_secret_at_least_16_chars
      SMS_PROVIDER: console
      ENV: test
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m app.seed
      - name: Start server
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 3000 > /tmp/uvicorn.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://localhost:3000/health/live && break || sleep 1
          done
      - name: Smoke
        working-directory: ${{ github.workspace }}
        run: bash scripts/smoke.sh
      - name: Server logs (on failure)
        if: failure()
        run: cat /tmp/uvicorn.log

  docker-build:
    # Heavy — keep it off develop entirely (issue #25), both pushes and PRs.
    # Runs on anything targeting main, or manual dispatch.
    name: server docker build
    if: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: carma-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
