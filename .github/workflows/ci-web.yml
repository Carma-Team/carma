name: CI · web

# web/ is a plain Vite + React SPA: no database, no heavy service container,
# nothing that makes any of these checks expensive. There is no cheap/full
# split like ci-server.yml's develop-push vs PR distinction, and no reason for
# one — so typecheck, lint and test all run unconditionally on every push and
# PR that touches web/. Deliberately not modeled on ci-mobile.yml's `test` and
# `contract-check` jobs, which are gated behind a `run-full-ci` label: CAR-8
# and CAR-121 are what happens when a check can be silently skipped while the
# workflow still reports green. None of the jobs below carry a conditional
# `if:` that could skip them on a normal PR.

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'web/**'
      - '.github/workflows/ci-web.yml'
  workflow_dispatch:

# One run per branch/PR. Superseded runs on develop and feature branches are
# cancelled; main is never cancelled so every deployable commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # web is an npm workspace sharing the root package-lock.json (like mobile),
  # so `npm ci` runs at the repo root — not inside ./web — same as ci-mobile.yml.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: TypeScript (no emit)
        working-directory: ./web
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: ESLint
        working-directory: ./web
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Vitest
        working-directory: ./web
        run: npm test
