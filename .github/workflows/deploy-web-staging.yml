name: Deploy web to staging

# Publishes the business web app (web/) to carma-business-staging, a second
# Azure Container App that exists solely so develop can be validated in a
# real browser before it is promoted to main. See docs/web-deployment.md for
# the full flow: feature branch -> develop -> staging validation -> main ->
# production.
#
# This workflow is deploy-web.yml's sibling, not a replacement for it.
# main keeps deploying to carma-business exactly as before; nothing here
# changes that path. The two are kept as separate files rather than one
# parameterised workflow because a bug in the staging YAML must never be able
# to affect the production job in the same run.
#
# Isolation from production, three separate points of failure protecting
# carma-business:
#   1. Trigger - this workflow only fires on develop; deploy-web.yml only on
#      main. A push to develop cannot reach the production job and vice versa.
#   2. Target - CONTAINER_APP below is carma-business-staging, a distinct
#      Azure Container App. `containerapp update` addresses it by name, so
#      even a misconfigured run here cannot touch carma-business.
#   3. Credential - `environment: staging` gives this job its own OIDC
#      federated-credential subject
#      (repo:Carma-Team/carma:environment:staging), separate from
#      production's (...:environment:production). See "One-time setup" in
#      docs/web-deployment.md for the credential this depends on.
#
# Required GitHub secrets - same managed identity as deploy.yml / deploy-web.yml,
# no new credential beyond the federated-credential subject above:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   AZURE_RESOURCE_GROUP, AZURE_CONTAINER_REGISTRY
#
# Required GitHub variable - public config, not a secret, same reasoning as
# deploy-web.yml's VITE_API_URL:
#   VITE_API_URL_STAGING   - the API origin staging builds against. Kept as
#                            its own variable rather than reusing VITE_API_URL
#                            so pointing staging at a different backend later
#                            never risks changing what main deploys with.
#                            Until CARMA has a staging API, this is expected
#                            to hold the same value as VITE_API_URL - see
#                            docs/web-deployment.md.
#
# Image tag carries a staging- prefix (not just the SHA deploy-web.yml uses)
# so `az acr repository show-tags` never leaves the two ambiguous in the same
# repository.
#
# Trigger: pushed to develop (path-filtered, same paths as deploy-web.yml), or
# manually via "Run workflow". A manual dispatch off any ref but develop is
# refused - the deployed assets must correspond to what is on develop.

on:
  push:
    branches: [develop]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy-web-staging.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Not a secret - the site's hostname is public by definition - so it stays
  # readable here instead of in the secret store. Distinct from
  # deploy-web.yml's carma-business on purpose: see the isolation note above.
  WEB_CONTAINER_APP: carma-business-staging

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Restrict to develop
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "::error::deploy-web-staging only deploys the develop ref; refusing to run for ${{ github.ref }} (event: ${{ github.event_name }})."
          exit 1

      - id: gate
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_CLIENT_ID not set — deploy is skipped."
          fi

  deploy:
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Require VITE_API_URL_STAGING
        env:
          VITE_API_URL_STAGING: ${{ vars.VITE_API_URL_STAGING }}
        run: |
          if [ -z "$VITE_API_URL_STAGING" ]; then
            echo "::error::VITE_API_URL_STAGING repository variable is not set — refusing to build with a guessed API origin. Set it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - name: Staging build
        working-directory: ./web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_STAGING }}
        run: npm run build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR via Azure CLI
        run: az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Build and push image
        id: build
        run: |
          IMAGE=${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io/carma-web:staging-${{ github.sha }}
          docker build -t "$IMAGE" ./web
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update Azure Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.WEB_CONTAINER_APP }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ steps.build.outputs.image }}

      - name: Report what shipped
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp show \
              --name ${{ env.WEB_CONTAINER_APP }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query "{revision:properties.latestRevisionName,image:properties.template.containers[0].image,fqdn:properties.configuration.ingress.fqdn}" \
              -o table
