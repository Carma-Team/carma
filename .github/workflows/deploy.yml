name: Deploy to Azure

# Deploys the server image to Azure Container Apps. Only runs when the
# AZURE_CLIENT_ID secret is configured, so this workflow is safe to merge
# before any Azure resources exist.
#
# Auth is GitHub OIDC against a user-assigned managed identity — GitHub proves
# its identity to Azure per run and there is no password stored anywhere.
#
# It is a managed identity rather than a service principal on purpose. Both
# `az ad app create` and `az ad sp create-for-rbac` are denied in this tenant:
# MTA's directory sets allowedToCreateApps=false and our account holds no
# directory role. That is a *directory* restriction — the Azure for Students
# subscription was never the blocker, we are Owner on it. A user-assigned
# managed identity is an Azure resource, created under that Owner role by the
# resource provider, and it takes the same federated credentials. (#58)
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   AZURE_CLIENT_ID                - client ID of the carma-ci managed identity
#   AZURE_TENANT_ID                - directory (tenant) ID
#   AZURE_SUBSCRIPTION_ID          - subscription ID
#   AZURE_RESOURCE_GROUP           - e.g. carma-rg
#   AZURE_CONTAINER_APP            - e.g. carma-api
#   AZURE_CONTAINER_REGISTRY       - e.g. carmaregistry  (without .azurecr.io)
#
# Required Container App environment variables — these are what the *server*
# needs to boot, which is a different list from the secrets above. With ENV set
# to production, a missing one is a startup ValueError and a crash loop, by
# design (app/config.py). Set them on the app itself, not here:
#   ENV=production                 - turns on the production-only guards below
#   DATABASE_URL                   - secretref, Postgres (asyncpg driver)
#   JWT_SECRET                     - secretref, 16+ chars
#   TRIP_SIGNING_SECRET            - secretref, 32+ chars; without it the trip
#                                    scoring oracle is open to anyone (#24)
#   TRUSTED_PROXY_COUNT=1          - set by this workflow, see the update step
#   CORS_ORIGINS                   - the deployed business web origin, exactly.
#                                    A wildcard here disables credentialed CORS
#                                    and no browser session can sign in (CAR-108)
#   REFRESH_COOKIE_SAMESITE=none   - the web app and the API are separate
#                                    Container App hostnames; see CAR-108 and
#                                    docs/web-deployment.md
#   SMS_PROVIDER + TWILIO_*        - only when sending real SMS
#   RECORDING_STORE=azure          - only to collect staged calibration drives
#   RECORDING_BLOB_CONNECTION_STRING - secretref, the storage account holding
#                                    them. Not needed to boot: without it the
#                                    upload route refuses, nothing else changes
#
# Database migrations run as a one-off Container Apps job, `carma-migrate`,
# between the image push and the rollout. If it fails the deploy stops and the
# old revision keeps serving — which is the whole point of doing it here rather
# than in the container's CMD, where a bad migration is an outage. It runs
# inside the Container Apps environment, so the runner never needs a database
# password or a hole in the Postgres firewall.
#
# The job is created once, by hand. It is not in this workflow because it holds
# a copy of the database secret, and a workflow that can mint that is a workflow
# that can leak it:
#
#   az containerapp job create \
#     --name carma-migrate --resource-group carma-rg --environment carma-env \
#     --trigger-type Manual --replica-timeout 600 --replica-retry-limit 0 \
#     --image carmaregistry3819.azurecr.io/carma-server:<any-existing-tag> \
#     --cpu 0.5 --memory 1Gi \
#     --registry-server carmaregistry3819.azurecr.io \
#     --registry-username <acr-user> --registry-password <acr-password> \
#     --secrets db-url=<same value as the app's db-url secret> \
#     --env-vars DATABASE_URL=secretref:db-url JWT_SECRET=migrations_do_not_sign_tokens \
#     --command alembic --args upgrade head
#
# JWT_SECRET is a throwaway on purpose. alembic/env.py imports app.config, which
# validates every setting including this one, but a migration never signs a
# token — so the real key stays in one place. ENV is left at its default, which
# is why TRIP_SIGNING_SECRET is not needed here.
#
# Two things this workflow depends on, which are easy to break by accident:
#   - `permissions: id-token: write` — without it there is no OIDC token at all.
#   - `environment: production` on the deploy job — the federated credential's
#     subject is repo:Carma-Team/carma:environment:production. Drop the
#     environment key and the subject silently becomes ...:ref:refs/heads/main,
#     which will not match, and login fails.
#
# Trigger: pushed to main, or manually via the "Run workflow" button.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_CLIENT_ID not set — deploy is skipped."
          fi

  deploy:
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR via Azure CLI
        run: az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Build and push image
        id: build
        run: |
          IMAGE=${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io/carma-server:${{ github.sha }}
          docker build -t "$IMAGE" ./server
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            RG=${{ secrets.AZURE_RESOURCE_GROUP }}

            # The job runs the image being deployed, so the migrations applied
            # are exactly the ones this commit carries.
            az containerapp job update \
              --name carma-migrate --resource-group "$RG" \
              --image ${{ steps.build.outputs.image }} --output none

            EXEC=$(az containerapp job start \
              --name carma-migrate --resource-group "$RG" --query name -o tsv)
            echo "migration run: $EXEC"

            # `job start` returns as soon as the execution is queued, so the
            # rollout below would otherwise race the schema it depends on.
            for _ in $(seq 1 60); do
              STATUS=$(az containerapp job execution show \
                --name carma-migrate --resource-group "$RG" \
                --job-execution-name "$EXEC" \
                --query properties.status -o tsv)
              case "$STATUS" in
                Succeeded)
                  echo "migrations applied"
                  exit 0
                  ;;
                Failed|Degraded)
                  echo "::error::migration $STATUS — nothing was deployed, the running revision is untouched. Logs: az containerapp job execution show -n carma-migrate -g $RG --job-execution-name $EXEC"
                  exit 1
                  ;;
              esac
              sleep 10
            done

            echo "::error::migration still running after 10 minutes — deploy stopped. Check $EXEC before retrying."
            exit 1

      - name: Update Azure Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            # TRUSTED_PROXY_COUNT describes our own topology rather than holding a
            # secret, so it belongs here instead of in the portal where it would be
            # one more thing to remember. 1 = the Container Apps ingress. The server
            # refuses to start in production without it, because the alternative is
            # counting every request against the ingress address and rate-limiting
            # the whole user base as one caller. `--set-env-vars` merges; the other
            # variables set on the app are left alone.
            az containerapp update \
              --name ${{ secrets.AZURE_CONTAINER_APP }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ steps.build.outputs.image }} \
              --set-env-vars TRUSTED_PROXY_COUNT=1

      # `az containerapp update` returns when the revision is created, not when it
      # serves, so a container that dies on a missing env var shipped green twice
      # (CAR-95, CAR-99).
      #
      # Two things this deliberately does not assert. `runningState` is not a
      # health signal while minReplicas is 0: an idle revision reads ScaledToZero
      # and flips to Running the moment anything touches it, so gating on it fails
      # a healthy deploy. And /health on its own proves nothing during a rollout,
      # because the previous revision keeps answering `ok` until traffic moves.
      # What is left is the pair that does mean something: the revision provisioned
      # and holds all the traffic, and then a real request to it comes back ok.
      - name: Verify the new revision serves
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            RG=${{ secrets.AZURE_RESOURCE_GROUP }}
            APP=${{ secrets.AZURE_CONTAINER_APP }}

            REVISION=$(az containerapp show -n "$APP" -g "$RG" \
              --query properties.latestRevisionName -o tsv)
            FQDN=$(az containerapp show -n "$APP" -g "$RG" \
              --query properties.configuration.ingress.fqdn -o tsv)
            echo "verifying $REVISION at https://$FQDN"

            dump_logs() {
              az containerapp logs show -n "$APP" -g "$RG" \
                --revision "$REVISION" --tail 100 --type console || true
            }

            READY=false
            for _ in $(seq 1 30); do
              # Queried separately on purpose: a two-element --query projection
              # prints one value per line rather than tab-separated, so `read` into
              # two names silently leaves the second one empty.
              PROV=$(az containerapp revision show -n "$APP" -g "$RG" \
                --revision "$REVISION" --query properties.provisioningState -o tsv)
              TRAFFIC=$(az containerapp revision show -n "$APP" -g "$RG" \
                --revision "$REVISION" --query properties.trafficWeight -o tsv)
              if [ "$PROV" = "Failed" ]; then
                echo "::error::revision $REVISION failed to provision. Traffic stays on the previous revision, so production is still up on the old image."
                dump_logs
                exit 1
              fi
              if [ "$PROV" = "Provisioned" ] && [ "$TRAFFIC" = "100" ]; then
                READY=true
                break
              fi
              sleep 10
            done

            if [ "$READY" != true ]; then
              echo "::error::revision $REVISION did not take traffic within 5 minutes (provisioningState=$PROV trafficWeight=$TRAFFIC)."
              dump_logs
              exit 1
            fi

            # A cold start on this app measured 24s against 1.6s warm, so the
            # per-request timeout has to clear the cold path or every attempt aborts
            # mid-boot and a healthy deploy reads as broken.
            BODY=""
            for _ in $(seq 1 6); do
              BODY=$(curl -fsS --max-time 45 "https://$FQDN/health" || true)
              case "$BODY" in
                *'"status":"ok"'*'"db":"ok"'*)
                  echo "health ok: $BODY"
                  exit 0
                  ;;
              esac
              sleep 10
            done

            echo "::error::$REVISION holds traffic but /health never returned ok. Last body: ${BODY:-<empty>}"
            dump_logs
            exit 1

      - name: Report what shipped
        uses: azure/cli@v2
        with:
          inlineScript: |
            # The image tag is the commit SHA, so this is the answer to
            # "what version is running?" — which had none while it was :latest.
            az containerapp show \
              --name ${{ secrets.AZURE_CONTAINER_APP }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query "{revision:properties.latestRevisionName,image:properties.template.containers[0].image}" \
              -o table
