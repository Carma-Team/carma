name: CI · mobile

# Day 1: only `npm ci` + tsc run on every PR. `npm test` and EAS build sanity
# are gated behind workflow_dispatch / the "run-full-ci" label until proven.
#
# develop guard (issue #25): pushes to develop run Jest. `tsc --noEmit` is
# skipped on develop until the 941-error toolchain break (#18) is fixed; it
# still blocks main / PRs. contract-check stays gated to main / PR-label.

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  workflow_dispatch:

# One run per branch/PR. Superseded runs on develop and feature branches are
# cancelled; main is never cancelled so every deployable commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  install-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: TypeScript (no emit)
        working-directory: ./mobile
        # Skipped on develop until #18 (941 tsc errors) is fixed — issue #25.
        # Covers both develop pushes and PRs into develop, otherwise opening a PR
        # against develop goes red on #18. The job still succeeds, so Jest
        # (needs: install-typecheck) still runs. tsc stays required on main.
        if: ${{ !(github.ref == 'refs/heads/develop' || github.base_ref == 'develop') }}
        run: npx tsc --noEmit

  test:
    # Cheap (~13s) — runs on every push and on PRs into develop, where it is the
    # only real gate while tsc is disabled. PRs into main stay label-gated until
    # the pipeline is proven (see header).
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'develop' || contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
    needs: install-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run tests
        working-directory: ./mobile
        run: npm test --if-present -- --ci --passWithNoTests

  # ── API Contract Drift Check ──────────────────────────────────────────────────
  # Spins up the FastAPI server, regenerates mobile/src/services/api/generated.ts
  # from the live OpenAPI schema, and fails if the output differs from what is
  # committed.  This catches the most common integration hazard: a backend schema
  # change (new field, renamed key, dropped endpoint) that was never propagated to
  # the mobile TypeScript types via `npm run gen:api`.
  #
  # Gate: "run-full-ci" label or workflow_dispatch (matches typecheck-test on server).
  # The job is intentionally gated so it does not block routine mobile-only PRs.
  contract-check:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-full-ci')) }}
    needs: install-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: carma
          POSTGRES_PASSWORD: carma_test
          POSTGRES_DB: carma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://carma:carma_test@localhost:5432/carma_test
      JWT_SECRET: ci_contract_check_secret_16c
      SMS_PROVIDER: console
      ENV: test
    steps:
      - uses: actions/checkout@v4

      # ── Server: install, migrate, start ──────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt
      - name: Install server deps & apply migrations
        working-directory: ./server
        run: |
          pip install -r requirements.txt
          alembic upgrade head
      - name: Start FastAPI server (background)
        working-directory: ./server
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 3000 > /tmp/contract-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://localhost:3000/health/live && break || sleep 1
          done

      # ── Mobile: install, snapshot committed types, regenerate ─────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install mobile deps
        run: npm ci
      - name: Snapshot committed generated types (pre-generation baseline)
        working-directory: ./mobile
        run: |
          if [ -f src/services/api/generated.ts ]; then
            cp src/services/api/generated.ts /tmp/generated.baseline.ts
          else
            # No baseline committed yet — create empty so diff is total output
            touch /tmp/generated.baseline.ts
          fi
      - name: Regenerate types from live OpenAPI schema
        working-directory: ./mobile
        # gen:api = openapi-typescript http://localhost:3000/api/openapi.json -o src/services/api/generated.ts
        run: npm run gen:api

      # ── Drift check ───────────────────────────────────────────────────────────
      - name: Check for API contract drift
        working-directory: ./mobile
        run: |
          if ! diff -q /tmp/generated.baseline.ts src/services/api/generated.ts > /dev/null 2>&1; then
            echo "::error::API contract drift detected — server schema diverges from committed generated types."
            echo "::error::Run 'npm run gen:api' in ./mobile and commit the updated src/services/api/generated.ts."
            diff /tmp/generated.baseline.ts src/services/api/generated.ts || true
            exit 1
          fi
          echo "✓ No API contract drift — generated types are in sync with the server schema."

      - name: Server logs (on failure)
        if: failure()
        run: cat /tmp/contract-server.log || true
