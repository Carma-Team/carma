name: CI · mobile

# Day 1: only `npm ci` + tsc run on every PR. `npm test` and EAS build sanity
# are gated behind workflow_dispatch / the "run-full-ci" label until proven.
#
# tsc and ESLint run everywhere, including develop. The develop skip that used
# to guard the 941-error toolchain break (CAR-8) is gone — CAR-8 is fixed, and
# the skip is what let the break survive 100+ commits unnoticed. Do not add it
# back: if these go red, fix the code.
#
# contract-check is gone (CAR-97). schema-drift replaces it and is not the same
# job: it reads the schema straight off the FastAPI app object, so there is no
# Postgres service, no migrations and no uvicorn to wait on — seconds, not minutes.
#
# Why a job at all, when types/index.ts derives from the generated file: tsc only
# sees what is committed. It compiles happily against a stale generated.ts and
# says nothing until somebody regenerates. This is the step that notices.

# server/ is in the path filter on purpose. A schema change is a mobile event: it
# is what makes generated.ts stale, and running mobile tsc against it is what
# surfaces the consequences. requirements.txt counts too — fastapi and pydantic
# versions change the generated output, which is how this file went stale once.
on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - 'server/app/**'
      - 'server/requirements.txt'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - 'server/app/**'
      - 'server/requirements.txt'
      - '.github/workflows/ci-mobile.yml'
  workflow_dispatch:

# One run per branch/PR. Superseded runs on develop and feature branches are
# cancelled; main is never cancelled so every deployable commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  install-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: TypeScript (no emit)
        working-directory: ./mobile
        run: npx tsc --noEmit

      # Runs even if tsc failed, so one push reports both problems at once.
      - name: ESLint
        working-directory: ./mobile
        if: ${{ !cancelled() }}
        run: npm run lint

  test:
    # Cheap (~13s) — runs on every push and on PRs into develop. PRs into main
    # stay label-gated until the pipeline is proven (see header).
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'develop' || contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
    needs: install-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run tests
        working-directory: ./mobile
        run: npm test --if-present -- --ci --passWithNoTests

  schema-drift:
    # Fails when the committed generated.ts is not what the current server schema
    # produces — i.e. someone changed a schema and skipped `npm run gen:api`.
    # Pinned deps matter: fastapi/pydantic decide how free-form objects are
    # rendered, so this installs requirements.txt rather than the latest.
    needs: install-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: pip install -r server/requirements.txt
      - run: npm ci

      # Placeholders, not credentials. Settings() validates database_url and
      # jwt_secret at import time, so the app will not import without them —
      # locally that is served by server/.env, which CI does not have. Nothing
      # opens a connection: rendering the schema never leaves the process.
      - name: Regenerate types from the server schema
        env:
          DATABASE_URL: postgresql+asyncpg://schema:schema@localhost:5432/schema
          JWT_SECRET: ci_schema_drift_placeholder_key
        run: |
          (cd server && python -c "import json;from app.main import app;json.dump(app.openapi(),open('../openapi.json','w'))")
          (cd mobile && npx openapi-typescript ../openapi.json -o src/services/api/generated.ts)

      - name: Fail if the committed types are stale
        run: |
          if ! git diff --exit-code mobile/src/services/api/generated.ts; then
            echo "::error::mobile/src/services/api/generated.ts is out of date."
            echo "::error::Run 'cd mobile && npm run gen:api' against a server on :3000 and commit the result."
            exit 1
          fi
